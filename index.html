<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance OS</title>

<style>
body{font-family:Segoe UI;margin:0;background:#f5f7fb}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#fff;border-bottom:1px solid #ddd}
.nav span{margin:0 15px;cursor:pointer;color:#555}
.nav span:hover{color:#000}
.container{padding:30px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.big{font-size:35px;font-weight:bold}

button{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
.logout{background:#000}
.hidden{display:none}

input,select{padding:8px;margin:6px 0;width:100%}

table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}

.section{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
<h2>Login</h2>

<select id="role">
<option value="admin">Admin</option>
<option value="student">Student</option>
<option value="faculty">Faculty</option>
</select>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="error" style="color:red"></p>
</div>

<!-- ADMIN PANEL -->
<div id="adminUI" class="hidden">
<div class="header">
<div><b>ATTENDANCE OS</b></div>

<div class="nav">
<span onclick="showSection('overview')">Overview</span>
<span onclick="showSection('students')">Students</span>
<span onclick="showSection('faculty')">Faculty</span>
<span onclick="showSection('subjects')">Subjects</span>
</div>

<div>
<b>Administrator</b>
<button class="logout" onclick="logout()">Sign Out</button>
</div>
</div>

<div class="container">

<div id="overview" class="section" style="display:block">
<h1>Control Room</h1>
<div class="cards">
<div class="card"><p>Students</p><div class="big" id="countStudents">0</div></div>
<div class="card"><p>Faculty</p><div class="big" id="countFaculty">0</div></div>
<div class="card"><p>Subjects</p><div class="big" id="countSubjects">0</div></div>
<div class="card"><p>Records</p><div class="big" id="countRecords">0</div></div>
</div>
</div>

<div id="students" class="section">
<h2>Students</h2>
<div class="card">
<input id="sname" placeholder="Name">
<input id="semail" placeholder="Email">
<input id="sdept" placeholder="Dept">
<input id="sroll" placeholder="Roll">
<input id="spass" placeholder="Password">
<button onclick="addStudent()">Add Student</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Roll</th></tr></thead>
<tbody id="studentsTable"></tbody>
</table>
</div>

<div id="faculty" class="section">
<h2>Faculty</h2>
<div class="card">
<input id="fname" placeholder="Name">
<input id="femail" placeholder="Email">
<input id="fpass" placeholder="Password">
<button onclick="addFaculty()">Add Faculty</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th></tr></thead>
<tbody id="facultyTable"></tbody>
</table>
</div>

<div id="subjects" class="section">
<h2>Subjects</h2>
<div class="card">
<input id="subcode" placeholder="Code">
<input id="subname" placeholder="Name">
<input id="subdept" placeholder="Dept">
<input id="subfac" placeholder="Faculty Email">
<button onclick="addSubject()">Add Subject</button>
</div>

<table>
<thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Faculty</th></tr></thead>
<tbody id="subjectsTable"></tbody>
</table>
</div>

</div>
</div>

<!-- STUDENT PANEL -->
<div id="studentUI" class="container hidden">
<h2>Student Dashboard</h2>

<div class="card">
<h3 id="studentName"></h3>
<p><b>Roll:</b> <span id="studentRoll"></span></p>
<p><b>Dept:</b> <span id="studentDept"></span></p>
</div>

<div class="card">
<h2>Attendance</h2>
<div class="big" id="attendancePercent">0%</div>
<p id="warningMsg"></p>
</div>

<button class="logout" onclick="logout()">Logout</button>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyKM5p_aq6BHg-WK4hNC9loBTD2xYN3_iaOPZQKH7DWB4f13c5mjqCyHyxdfiud0D7C/exec";

/* LOGIN */
function login(){
  const roleVal = document.getElementById("role").value;
  const emailVal = document.getElementById("email").value.trim();
  const passVal = document.getElementById("password").value.trim();

  if(roleVal==="admin"){
    if(emailVal==="Admin@gmail.com" && passVal==="Admin@1234"){
      login.style.display="none";
      adminUI.classList.remove("hidden");
      loadAll();
    }else{
      error.innerText="Invalid Admin";
    }
    return;
  }

  const old = document.getElementById("loginScript");
  if(old) old.remove();

  const script = document.createElement("script");
  script.id = "loginScript";
  script.src = API + "?callback=handleLoginData";
  document.body.appendChild(script);

  window.handleLoginData = function(data){
    console.log("LOGIN DATA:", data);

    if(roleVal==="student"){
      const user = data.students.find(s =>
        s.Email.trim() === emailVal &&
        String(s.Password).trim() === passVal
      );

      if(user){
        document.getElementById("login").style.display="none";
        studentUI.classList.remove("hidden");
        loadStudentDashboard(user, data.records);
      }else{
        error.innerText="Invalid Student";
      }
    }

    if(roleVal==="faculty"){
      const user = data.faculty.find(f =>
        f.Email.trim() === emailVal &&
        String(f.Password).trim() === passVal
      );

      if(user){
        alert("Faculty Login Success");
      }else{
        error.innerText="Invalid Faculty";
      }
    }
  }
}

function logout(){location.reload()}

/* NAVIGATION */
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ADMIN LOAD */
function loadAll(){
  const old = document.getElementById("jsonpScript");
  if(old) old.remove();

  const script = document.createElement("script");
  script.id = "jsonpScript";
  script.src = API + "?callback=handleData";
  document.body.appendChild(script);
}

function handleData(data){
  countStudents.innerText = data.students?.length || 0;
  countFaculty.innerText = data.faculty?.length || 0;
  countSubjects.innerText = data.subjects?.length || 0;
  countRecords.innerText = data.records?.length || 0;

  studentsTable.innerHTML = data.students.map(s =>
    `<tr><td>${s.Name}</td><td>${s.Email}</td><td>${s.Dept}</td><td>${s.Roll}</td></tr>`
  ).join("");

  facultyTable.innerHTML = data.faculty.map(f =>
    `<tr><td>${f.Name}</td><td>${f.Email}</td></tr>`
  ).join("");

  subjectsTable.innerHTML = data.subjects.map(s =>
    `<tr><td>${s.Code}</td><td>${s.Name}</td><td>${s.Dept}</td><td>${s.Faculty}</td></tr>`
  ).join("");
}

/* STUDENT DASHBOARD */
function loadStudentDashboard(user, records){
  studentName.innerText = user.Name;
  studentRoll.innerText = user.Roll;
  studentDept.innerText = user.Dept;

  const myRecords = records.filter(r => String(r.Roll) === String(user.Roll));

  let total = 0, attended = 0;
  myRecords.forEach(r=>{
    total += Number(r.Total)||0;
    attended += Number(r.Attended)||0;
  });

  let percent = total ? ((attended/total)*100).toFixed(2) : 0;
  attendancePercent.innerText = percent + "%";

  if(percent < 75){
    warningMsg.innerText = "⚠️ Low Attendance";
    warningMsg.style.color = "red";
  }else{
    warningMsg.innerText = "✅ Good Attendance";
    warningMsg.style.color = "green";
  }
}

/* ADD FUNCTIONS */
function addStudent(){
  fetch(`${API}?type=student&name=${sname.value}&email=${semail.value}&dept=${sdept.value}&roll=${sroll.value}&password=${spass.value}`);
  alert("Student Added");
  loadAll();
}

function addFaculty(){
  fetch(`${API}?type=faculty&name=${fname.value}&email=${femail.value}&password=${fpass.value}`);
  alert("Faculty Added");
  loadAll();
}

function addSubject(){
  fetch(`${API}?type=subject&code=${subcode.value}&name=${subname.value}&dept=${subdept.value}&faculty=${subfac.value}`);
  alert("Subject Added");
  loadAll();
}

</script>

</body>
</html>
