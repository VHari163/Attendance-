<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance OS</title>

<style>
body{font-family:Segoe UI;margin:0;background:#f5f7fb}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#fff;border-bottom:1px solid #ddd}
.nav span{margin:0 15px;cursor:pointer;color:#555}
.nav span:hover{color:#000}
.container{padding:30px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.big{font-size:35px;font-weight:bold}

button{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
.logout{background:#000}
.hidden{display:none}

input,select{padding:8px;margin:6px 0;width:100%}

table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}

.section{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
<h2>Login</h2>

<select id="role">
<option value="admin">Admin</option>
<option value="student">Student</option>
<option value="faculty">Faculty</option>
</select>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="error" style="color:red"></p>
</div>

<!-- ADMIN PANEL -->
<div id="adminUI" class="hidden">

<div class="header">
<div><b>ATTENDANCE OS</b></div>

<div class="nav">
<span onclick="showSection('overview')">Overview</span>
<span onclick="showSection('students')">Students</span>
<span onclick="showSection('faculty')">Faculty</span>
<span onclick="showSection('subjects')">Subjects</span>
</div>

<div>
<b>Administrator</b>
<button class="logout" onclick="logout()">Sign Out</button>
</div>
</div>

<div class="container">

<!-- OVERVIEW -->
<div id="overview" class="section" style="display:block">
<h1>Control Room</h1>

<div class="cards">
<div class="card"><p>Students</p><div class="big" id="countStudents">0</div></div>
<div class="card"><p>Faculty</p><div class="big" id="countFaculty">0</div></div>
<div class="card"><p>Subjects</p><div class="big" id="countSubjects">0</div></div>
<div class="card"><p>Records</p><div class="big" id="countRecords">0</div></div>
</div>
</div>

<!-- STUDENTS -->
<div id="students" class="section">
<h2>Students</h2>

<div class="card">
<input id="sname" placeholder="Name">
<input id="semail" placeholder="Email">
<input id="sdept" placeholder="Dept">
<input id="sroll" placeholder="Roll">
<input id="spass" placeholder="Password">
<button onclick="addStudent()">Add Student</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Roll</th></tr></thead>
<tbody id="studentsTable"></tbody>
</table>
</div>

<!-- FACULTY -->
<div id="faculty" class="section">
<h2>Faculty</h2>

<div class="card">
<input id="fname" placeholder="Name">
<input id="femail" placeholder="Email">
<input id="fpass" placeholder="Password">
<button onclick="addFaculty()">Add Faculty</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th></tr></thead>
<tbody id="facultyTable"></tbody>
</table>
</div>

<!-- SUBJECTS -->
<div id="subjects" class="section">
<h2>Subjects</h2>

<div class="card">
<input id="subcode" placeholder="Code">
<input id="subname" placeholder="Name">
<input id="subdept" placeholder="Dept">
<input id="subfac" placeholder="Faculty Email">
<button onclick="addSubject()">Add Subject</button>
</div>

<table>
<thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Faculty</th></tr></thead>
<tbody id="subjectsTable"></tbody>
</table>
</div>

</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzIwKLf3NFuJI8UrKBnra6P_MeL_82iP9HttK-M7BM0_gKaxCjGGEHXfATFCTh6PAGe/exec";

/* FIXED FETCH */
async function fetchAPI(options={}){
  try{
    const res = await fetch(API,{
      method: options.method || "GET",
      body: options.body,
      headers: {"Content-Type":"application/json"}
    });

    const text = await res.text();   // IMPORTANT FIX
    try{
      return JSON.parse(text);
    }catch{
      return text;
    }

  }catch(err){
    console.error(err);
    document.getElementById("error").innerText="API Error";
  }
}

/* LOGIN */
async function login(){
  const role = document.getElementById("role").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(role==="admin"){
    if(email==="Admin@gmail.com" && password==="Admin@1234"){
      document.getElementById("login").style.display="none";
      document.getElementById("adminUI").classList.remove("hidden");
      loadAll();
    }else{
      error.innerText="Invalid Admin";
    }
  }
}

function logout(){location.reload()}

/* NAVIGATION */
function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* LOAD DATA */
async function loadAll(){
  let data = await fetchAPI();
  if(!data) return;

  countStudents.innerText = data.students.length;
  countFaculty.innerText = data.faculty.length;
  countSubjects.innerText = data.subjects.length;
  countRecords.innerText = data.records.length;

  studentsTable.innerHTML = data.students.map(s=>
    `<tr><td>${s.Name}</td><td>${s.Email}</td><td>${s.Dept}</td><td>${s.Roll}</td></tr>`
  ).join("");

  facultyTable.innerHTML = data.faculty.map(f=>
    `<tr><td>${f.Name}</td><td>${f.Email}</td></tr>`
  ).join("");

  subjectsTable.innerHTML = data.subjects.map(s=>
    `<tr><td>${s.Code}</td><td>${s.Name}</td><td>${s.Dept}</td><td>${s.Faculty}</td></tr>`
  ).join("");
}

/* ADD FUNCTIONS */
async function addStudent(){
  const url = `${API}?type=student&name=${encodeURIComponent(sname.value)}&email=${encodeURIComponent(semail.value)}&dept=${encodeURIComponent(sdept.value)}&roll=${encodeURIComponent(sroll.value)}&password=${encodeURIComponent(spass.value)}`;
  
  await fetch(url);
  alert("Student Added");
  loadAll();
}

async function addFaculty(){
  const url = `${API}?type=faculty&name=${encodeURIComponent(fname.value)}&email=${encodeURIComponent(femail.value)}&password=${encodeURIComponent(fpass.value)}`;
  
  await fetch(url);
  alert("Faculty Added");
  loadAll();
}

async function addSubject(){
  const url = `${API}?type=subject&code=${encodeURIComponent(subcode.value)}&name=${encodeURIComponent(subname.value)}&dept=${encodeURIComponent(subdept.value)}&faculty=${encodeURIComponent(subfac.value)}`;
  
  await fetch(url);
  alert("Subject Added");
  loadAll();
}

</script>

</body>
</html>
