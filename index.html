<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance OS</title>

<style>
body{font-family:Segoe UI;margin:0;background:#f5f7fb}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#fff;border-bottom:1px solid #ddd}
.nav span{margin:0 15px;cursor:pointer;color:#555}
.nav span:hover{color:#000}
.container{padding:30px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.big{font-size:35px;font-weight:bold}

button{padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
.logout{background:#000}
.hidden{display:none}

input,select{padding:8px;margin:6px 0;width:100%}

table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}

.section{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="container">
<h2>Login</h2>

<select id="role">
<option value="admin">Admin</option>
<option value="student">Student</option>
<option value="faculty">Faculty</option>
</select>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="error" style="color:red"></p>
</div>

<!-- ADMIN PANEL -->
<div id="adminUI" class="hidden">
<div class="header">
<div><b>ATTENDANCE OS</b></div>

<div class="nav">
<span onclick="showSection('overview')">Overview</span>
<span onclick="showSection('students')">Students</span>
<span onclick="showSection('faculty')">Faculty</span>
<span onclick="showSection('subjects')">Subjects</span>
</div>

<div>
<b>Administrator</b>
<button class="logout" onclick="logout()">Sign Out</button>
</div>
</div>

<div class="container">

<div id="overview" class="section" style="display:block">
<h1>Control Room</h1>
<div class="cards">
<div class="card"><p>Students</p><div class="big" id="countStudents">0</div></div>
<div class="card"><p>Faculty</p><div class="big" id="countFaculty">0</div></div>
<div class="card"><p>Subjects</p><div class="big" id="countSubjects">0</div></div>
<div class="card"><p>Records</p><div class="big" id="countRecords">0</div></div>
</div>
</div>

<div id="students" class="section">
<h2>Students</h2>
<div class="card">
<input id="sname" placeholder="Name">
<input id="semail" placeholder="Email">
<input id="sdept" placeholder="Dept">
<input id="sroll" placeholder="Roll">
<input id="spass" placeholder="Password">
<button onclick="addStudent()">Add Student</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Roll</th></tr></thead>
<tbody id="studentsTable"></tbody>
</table>
</div>

<div id="faculty" class="section">
<h2>Faculty</h2>
<div class="card">
<input id="fname" placeholder="Name">
<input id="femail" placeholder="Email">
<input id="fpass" placeholder="Password">
<button onclick="addFaculty()">Add Faculty</button>
</div>

<table>
<thead><tr><th>Name</th><th>Email</th></tr></thead>
<tbody id="facultyTable"></tbody>
</table>
</div>

<div id="subjects" class="section">
<h2>Subjects</h2>
<div class="card">
<input id="subcode" placeholder="Code">
<input id="subname" placeholder="Name">
<input id="subdept" placeholder="Dept">
<input id="subfac" placeholder="Faculty Email">
<button onclick="addSubject()">Add Subject</button>
</div>

<table>
<thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Faculty</th></tr></thead>
<tbody id="subjectsTable"></tbody>
</table>
</div>

</div>
</div>

<!-- STUDENT PANEL -->
<div id="studentUI" class="container hidden">
<h2>Student Dashboard</h2>

<div class="card">
<h3 id="studentName"></h3>
<p><b>Roll:</b> <span id="studentRoll"></span></p>
<p><b>Dept:</b> <span id="studentDept"></span></p>
</div>

<div class="card">
<h2>Attendance</h2>
<div class="big" id="attendancePercent">0%</div>
<p id="warningMsg"></p>
</div>

<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- FACULTY PANEL -->
<div id="facultyUI" class="container hidden">
<h2>Faculty Dashboard</h2>

<div class="card">
<input id="fRoll" placeholder="Student Roll">
<input id="fSubject" placeholder="Subject Code">
<input id="fTotal" placeholder="Total Classes">
<input id="fAttended" placeholder="Attended Classes">
<button onclick="uploadAttendance()">Upload Attendance</button>
</div>

<button class="logout" onclick="logout()">Logout</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyKM5p_aq6BHg-WK4hNC9loBTD2xYN3_iaOPZQKH7DWB4f13c5mjqCyHyxdfiud0D7C/exec";

let GLOBAL_DATA = null;

/* LOGIN */
function login(){
  const role = roleSelect();
  const email = emailInput();
  const password = passwordInput();

  error.innerText="";

  if(role==="admin"){
    if(email==="Admin@gmail.com" && password==="Admin@1234"){
      hide("login"); show("adminUI");
      loadAll();
    } else error.innerText="Invalid Admin";
    return;
  }

  loadAll(()=>{
    if(!GLOBAL_DATA) return error.innerText="Data error";

    if(role==="student"){
      const user = GLOBAL_DATA.students.find(s =>
        s.Email?.trim()===email &&
        String(s.Password||"").trim()===password
      );

      if(!user) return error.innerText="Invalid Student";

      hide("login"); show("studentUI");

      studentName.innerText=user.Name;
      studentRoll.innerText=user.Roll;
      studentDept.innerText=user.Dept;

      const rec = GLOBAL_DATA.records.filter(r=>r.Roll==user.Roll);
      let t=0,a=0;
      rec.forEach(r=>{t+=+r.Total||0;a+=+r.Attended||0});

      let p = t?((a/t)*100).toFixed(2):0;
      attendancePercent.innerText=p+"%";

      if(p<75){warningMsg.innerText="⚠️ Low Attendance";warningMsg.style.color="red";}
      else{warningMsg.innerText="Good";warningMsg.style.color="green";}
    }

    if(role==="faculty"){
      const user = GLOBAL_DATA.faculty.find(f =>
        f.Email?.trim()===email &&
        String(f.Password||f["Password"]||"").trim()===password
      );

      if(!user) return error.innerText="Invalid Faculty";

      hide("login"); show("facultyUI");
    }
  });
}

function uploadAttendance(){
  const url = `${API}?roll=${fRoll.value}&subject=${fSubject.value}&total=${fTotal.value}&attended=${fAttended.value}`;
  fetch(url);
  alert("Uploaded");
}

function loadAll(cb){
  const old=document.getElementById("jsonpScript");
  if(old) old.remove();

  window.afterLoad=cb;

  const s=document.createElement("script");
  s.id="jsonpScript";
  s.src=API+"?callback=handleData";
  document.body.appendChild(s);
}

function handleData(data){
  GLOBAL_DATA=data;

  if(!adminUI.classList.contains("hidden")){
    countStudents.innerText=data.students.length;
    countFaculty.innerText=data.faculty.length;
    countSubjects.innerText=data.subjects.length;
    countRecords.innerText=data.records.length;

    studentsTable.innerHTML=data.students.map(s=>`
    <tr><td>${s.Name}</td><td>${s.Email}</td><td>${s.Dept}</td><td>${s.Roll}</td></tr>`).join("");

    facultyTable.innerHTML=data.faculty.map(f=>`
    <tr><td>${f.Name}</td><td>${f.Email}</td></tr>`).join("");

    subjectsTable.innerHTML=data.subjects.map(s=>`
    <tr><td>${s.Code}</td><td>${s.Name}</td><td>${s.Dept}</td><td>${s.Faculty}</td></tr>`).join("");
  }

  if(window.afterLoad){window.afterLoad();window.afterLoad=null;}
}

/* HELPERS */
function hide(id){document.getElementById(id).style.display="none"}
function show(id){document.getElementById(id).classList.remove("hidden")}
function roleSelect(){return document.getElementById("role").value}
function emailInput(){return document.getElementById("email").value.trim()}
function passwordInput(){return document.getElementById("password").value.trim()}
function logout(){location.reload()}

/* ADD */
function addStudent(){fetch(`${API}?type=student&name=${sname.value}&email=${semail.value}&dept=${sdept.value}&roll=${sroll.value}&password=${spass.value}`);loadAll();}
function addFaculty(){fetch(`${API}?type=faculty&name=${fname.value}&email=${femail.value}&password=${fpass.value}`);loadAll();}
function addSubject(){fetch(`${API}?type=subject&code=${subcode.value}&name=${subname.value}&dept=${subdept.value}&faculty=${subfac.value}`);loadAll();}

</script>

</body>
</html>
